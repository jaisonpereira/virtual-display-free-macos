name: Build and test
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build universal macOS app
        run: ./scripts/build.sh
      - name: Test without modifying displays
        run: ./scripts/test.sh
      - name: Package app
        run: ditto -c -k --sequesterRsrc --keepParent build/virtual-display-free-macos.app build/virtual-display-free-macos.zip
      - uses: actions/upload-artifact@v4
        with:
          name: virtual-display-free-macos
          path: build/virtual-display-free-macos.zip
